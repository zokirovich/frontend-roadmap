<!DOCTYPE html>
<!-- Bu qator hujjat turini bildiradi - HTML5 ekanligini brauzerga aytadi -->

<html lang="en">
<!-- Butun sahifaning asosiy (root) elementi, tili ingliz tilida -->

<head>
	<!-- Sahifaning ko'rinmaydigan, texnik ma'lumotlari shu yerda joylashadi -->

	<meta charset="UTF-8">
	<!-- Belgilar kodlashini UTF-8 qilib belgilaydi (barcha tillar to'g'ri chiqishi uchun) -->

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Sahifani mobil qurilmalarda to'g'ri ko'rsatish uchun sozlama -->

	<title>Document</title>
	<!-- Brauzer tabida chiqadigan sarlavha (o'zgartirish mumkin) -->

</head>
<!-- head qismining tugashi -->

<body>
	<!-- Sahifaning asosiy, foydalanuvchi ko'radigan qismi shu yerdan boshlanadi -->
	<!-- Matn, rasm, tugma va h.k. shu yerga yoziladi -->

</body>
<!-- body qismining tugashi -->

</html>
<!-- Butun HTML hujjatning tugashi -->

<!-- HTML5 da ochiluvchi tag va o`zini yopuvchi tag lar mavjud  -->
